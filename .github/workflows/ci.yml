name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: Build/xcodegen/Keyfob.xcodeproj
  # Disable code signing for CI builds
  CI_BUILD_SETTINGS: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGN_IDENTITY=-
    DEVELOPMENT_TEAM=

jobs:
  # ── SPM library build + tests ──────────────────────────────────
  spm-test:
    name: SPM Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

  # ── Xcode app target builds (iOS + macOS) ──────────────────────
  xcode-build:
    name: Xcode Build (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Keyfob-iOS
            destination: "platform=iOS Simulator,name=iPhone 15,OS=latest"
          - scheme: Keyfob-macOS
            destination: "platform=macOS"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Xcode SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-xcode-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "${{ matrix.scheme }}"

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            $CI_BUILD_SETTINGS \
            2>&1 | tee build.log | tail -30
          echo "✅ Build succeeded"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: build.log

  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Sources
        run: swiftlint lint --strict --reporter github-actions Sources/

      - name: Lint Tests
        run: swiftlint lint --reporter github-actions Tests/

  # ── Archive on tag push ─────────────────────────────────────────
  archive:
    name: Archive (${{ matrix.scheme }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [spm-test, xcode-build, lint]
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - scheme: Keyfob-iOS
            destination: "generic/platform=iOS"
          - scheme: Keyfob-macOS
            destination: "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "${{ matrix.scheme }}"

      - name: Archive ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -archivePath "${{ runner.temp }}/${{ matrix.scheme }}.xcarchive" \
            $CI_BUILD_SETTINGS \
            SKIP_INSTALL=NO \
            2>&1 | tee archive.log | tail -30
          echo "✅ Archive succeeded"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-archive
          path: ${{ runner.temp }}/${{ matrix.scheme }}.xcarchive

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log-${{ matrix.scheme }}
          path: archive.log
