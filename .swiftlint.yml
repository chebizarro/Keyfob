# ──────────────────────────────────────────────────────────────────
# Keyfob SwiftLint Configuration
# ──────────────────────────────────────────────────────────────────

included:
  - Sources
  - Tests
  - Apps
  - Extensions

excluded:
  - .build
  - Build/xcodegen
  - Package.swift

# ── Rules ─────────────────────────────────────────────────────────

disabled_rules:
  # Allow force-unwraps in test code and controlled production paths
  - force_cast
  # Nesting is sometimes clearer for protocol-in-class patterns
  - nesting
  # Large enum files are fine for policy models
  - file_length
  # Trailing comma style is a matter of taste
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - private_action
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

# ── Thresholds ────────────────────────────────────────────────────

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - i
    - j
    - k
    - x
    - y
    - id
    - ch
    - b

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# ── Per-File Overrides ────────────────────────────────────────────

# Tests use force-unwraps and longer functions freely
force_unwrapping:
  severity: warning

# Allow longer test functions
custom_rules:
  test_function_length:
    included: Tests/.*\.swift
    name: "Test function too long"
    regex: "func test.+\\{[^}]{5000,}\\}"
    message: "Consider breaking this test into smaller focused tests."
    severity: warning
